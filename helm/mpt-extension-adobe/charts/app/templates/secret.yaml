apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
data:
  SDK_EXTENSION_API_KEY: {{ .Values.global.SdkExtensionApiKey }}
  SDK_APPLICATIONINSIGHTS_CONNECTION_STRING: {{ .Values.global.AppInsightsConnectionString }}
  MPT_API_TOKEN: {{ .Values.global.MptApiToken }}
  MPT_TOOL_STORAGE_AIRTABLE_API_KEY: {{ .Values.global.AirTableApiToken }}
---
apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "common.fullname" . }}.files
  labels:
    {{- include "common.labels" . | nindent 4 }}
data:
  adobe_credentials.json: {{ .Values.global.CredentialsJson }}
  adobe_authorizations.json: {{ .Values.global.AuthorizationsJson }}
