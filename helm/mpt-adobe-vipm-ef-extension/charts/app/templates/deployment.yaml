apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "common.fullname" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.global.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.pyracloud.com/access-policy: {{ .Values.accessPolicy }}
        app.pyracloud.com/access-policy-audience: {{ .Values.accessPolicyAudience }}
        {{- include "common.labels" . | nindent 8 }}
    spec:
      volumes:
        - name: file-mount
          secret:
            secretName: {{ include "common.fullname" . }}.files
      containers:
        - name: main
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.global.registryUrl }}{{ .Values.image.repository }}:{{ .Chart.AppVersion }}"
          # Production mode: `mpt-ext run` (no --local) registers the instance and
          # serves over OpenZiti (Ziticorn). There is no inbound cluster port.
          command:
            - mpt-ext
          args:
            - run
          volumeMounts:
            - name: file-mount
              mountPath: /extension/config
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: EXT_ADOBE_CREDENTIALS_FILE
              value: /extension/config/adobe_credentials.json
            - name: EXT_ADOBE_AUTHORIZATIONS_FILE
              value: /extension/config/adobe_authorizations.json
          envFrom:
            - configMapRef:
                name: ops-pyc-cluster-teamsetup-default-env-variables
            - configMapRef:
                name: {{ include "common.fullname" . }}
            - secretRef:
                name: {{ include "common.fullname" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        # Default affinity is set to ensure all pods are not located on the same node.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - {{ include "common.name" . }}
                - key: app.kubernetes.io/instance
                  operator: In
                  values:
                  - {{ .Release.Name }}
              topologyKey: "kubernetes.io/hostname"
    {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
