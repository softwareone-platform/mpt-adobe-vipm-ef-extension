#https://dev.azure.com/softwareone-pc/MPT/_build?definitionId=5655

trigger:
  branches:
    include:
      - main
      - release/*

pool:
  name: Standard-Linux

resources:
  repositories:
    - repository: buildTemplates
      type: git
      name: MPT/ops-build-templates
      ref: refs/heads/feature/build_template

extends:
  template: common-build/extends-py.yml@buildTemplates
  parameters:
    appName: mpt-extension-adobe
    deploymentManifestEnabled: true
    sbomWorkingDirectory: /backend
